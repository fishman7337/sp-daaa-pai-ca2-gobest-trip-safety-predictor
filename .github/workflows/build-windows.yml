name: Build Windows Executable

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Lint
        run: python -m ruff check .

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Run tests
        run: python -m pytest -q

      - name: Build executable
        run: python -m PyInstaller PAI_CA2_GUI.spec --noconfirm --clean

      - name: Smoke-test executable
        shell: pwsh
        run: |
          $startInfo = @{
            FilePath = "dist\PAI_CA2_GUI.exe"
            ArgumentList = "--smoke-test"
            Wait = $true
            PassThru = $true
          }
          $process = Start-Process @startInfo
          if ($process.ExitCode -ne 0) {
            throw "Packaged application smoke test failed with exit code $($process.ExitCode)."
          }

      - name: Create checksum
        shell: pwsh
        run: |
          Get-FileHash dist\PAI_CA2_GUI.exe -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  PAI_CA2_GUI.exe" } |
            Set-Content -Encoding ascii dist\PAI_CA2_GUI.exe.sha256

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: PAI_CA2_GUI-windows
          path: |
            dist/PAI_CA2_GUI.exe
            dist/PAI_CA2_GUI.exe.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: PAI_CA2_GUI-windows
          path: dist

      - name: Publish GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            dist/PAI_CA2_GUI.exe
            dist/PAI_CA2_GUI.exe.sha256
