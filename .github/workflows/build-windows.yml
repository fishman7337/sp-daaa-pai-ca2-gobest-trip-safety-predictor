name: Build Windows Executable

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Build executable
        run: python -m PyInstaller PAI_CA2_GUI.spec --noconfirm --clean

      - name: Create checksum
        shell: pwsh
        run: |
          Get-FileHash dist\PAI_CA2_GUI.exe -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  PAI_CA2_GUI.exe" } |
            Set-Content -Encoding ascii dist\PAI_CA2_GUI.exe.sha256

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PAI_CA2_GUI-windows
          path: |
            dist/PAI_CA2_GUI.exe
            dist/PAI_CA2_GUI.exe.sha256

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/PAI_CA2_GUI.exe
            dist/PAI_CA2_GUI.exe.sha256
